syntax = "proto3";

package music_auto_show.v1;

service MusicAutoShowService {
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc WatchSnapshots(WatchSnapshotsRequest) returns (stream WatchSnapshotsResponse);
  rpc WatchLiveFrames(WatchLiveFramesRequest) returns (stream WatchLiveFramesResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);
  rpc ImportConfig(ImportConfigRequest) returns (ImportConfigResponse);
  rpc ResetConfig(ResetConfigRequest) returns (ResetConfigResponse);
  rpc ListAudioDevices(ListAudioDevicesRequest) returns (ListAudioDevicesResponse);
  rpc GetBluetoothReceiverStatus(GetBluetoothReceiverStatusRequest) returns (GetBluetoothReceiverStatusResponse);
  rpc SetBluetoothReceiverPairing(SetBluetoothReceiverPairingRequest) returns (SetBluetoothReceiverPairingResponse);
  rpc ConnectBluetoothReceiverDevice(ConnectBluetoothReceiverDeviceRequest) returns (ConnectBluetoothReceiverDeviceResponse);
  rpc DisconnectBluetoothReceiverDevice(DisconnectBluetoothReceiverDeviceRequest) returns (DisconnectBluetoothReceiverDeviceResponse);
  rpc ForgetBluetoothReceiverDevice(ForgetBluetoothReceiverDeviceRequest) returns (ForgetBluetoothReceiverDeviceResponse);
  rpc ListGrandMa2FixtureTypes(ListGrandMa2FixtureTypesRequest) returns (ListGrandMa2FixtureTypesResponse);
  rpc ImportGrandMa2Fixture(ImportGrandMa2FixtureRequest) returns (ImportGrandMa2FixtureResponse);
  rpc ControlShow(ControlShowRequest) returns (ControlShowResponse);
  rpc SetBlackout(SetBlackoutRequest) returns (SetBlackoutResponse);
  rpc StartRecording(StartRecordingRequest) returns (StartRecordingResponse);
  rpc StopRecording(StopRecordingRequest) returns (StopRecordingResponse);
  rpc ClearRecording(ClearRecordingRequest) returns (ClearRecordingResponse);
}

message GetSnapshotRequest {}

message GetSnapshotResponse {
  ShowSnapshot snapshot = 1;
}

message WatchSnapshotsRequest {
  uint32 interval_ms = 1;
}

message WatchSnapshotsResponse {
  ShowSnapshot snapshot = 1;
}

message WatchLiveFramesRequest {
  uint32 interval_ms = 1;
}

message WatchLiveFramesResponse {
  LiveFrame frame = 1;
}

message GetConfigRequest {}

message GetConfigResponse {
  ShowConfig config = 1;
}

message UpdateConfigRequest {
  ShowConfig config = 1;
}

message UpdateConfigResponse {
  ShowConfig config = 1;
}

message ExportConfigRequest {}

message ExportConfigResponse {
  string json = 1;
  string filename = 2;
}

message ImportConfigRequest {
  string json = 1;
}

message ImportConfigResponse {
  ShowConfig config = 1;
}

message ResetConfigRequest {}

message ResetConfigResponse {
  ShowConfig config = 1;
}

message ListAudioDevicesRequest {}

message ListAudioDevicesResponse {
  repeated AudioDevice devices = 1;
}

message GetBluetoothReceiverStatusRequest {}

message GetBluetoothReceiverStatusResponse {
  BluetoothReceiverStatus status = 1;
}

message SetBluetoothReceiverPairingRequest {
  bool enabled = 1;
  uint32 timeout_seconds = 2;
}

message SetBluetoothReceiverPairingResponse {
  BluetoothReceiverStatus status = 1;
}

message ConnectBluetoothReceiverDeviceRequest {
  string device_id = 1;
}

message ConnectBluetoothReceiverDeviceResponse {
  BluetoothReceiverStatus status = 1;
}

message DisconnectBluetoothReceiverDeviceRequest {
  string device_id = 1;
}

message DisconnectBluetoothReceiverDeviceResponse {
  BluetoothReceiverStatus status = 1;
}

message ForgetBluetoothReceiverDeviceRequest {
  string device_id = 1;
}

message ForgetBluetoothReceiverDeviceResponse {
  BluetoothReceiverStatus status = 1;
}

message ListGrandMa2FixtureTypesRequest {}

message ListGrandMa2FixtureTypesResponse {
  repeated GrandMa2FixtureType fixture_types = 1;
}

message ImportGrandMa2FixtureRequest {
  string filename = 1;
  bytes xml = 2;
}

message ImportGrandMa2FixtureResponse {
  ShowConfig config = 1;
  repeated GrandMa2FixtureType fixture_types = 2;
}

message ControlShowRequest {
  ShowCommand command = 1;
}

message SetBlackoutRequest {
  bool enabled = 1;
}

message StartRecordingRequest {}

message StopRecordingRequest {}

message ClearRecordingRequest {}

message ControlShowResponse {
  CommandResult result = 1;
}

message SetBlackoutResponse {
  CommandResult result = 1;
}

message StartRecordingResponse {
  RecordingStatus status = 1;
}

message StopRecordingResponse {
  Recording recording = 1;
}

message ClearRecordingResponse {
  RecordingStatus status = 1;
}

message CommandResult {
  bool success = 1;
  string message = 2;
  RunState run_state = 3;
  bool blackout = 4;
}

enum ShowCommand {
  SHOW_COMMAND_UNSPECIFIED = 0;
  SHOW_COMMAND_START = 1;
  SHOW_COMMAND_STOP = 2;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_STOPPED = 1;
  RUN_STATE_STARTING = 2;
  RUN_STATE_RUNNING = 3;
  RUN_STATE_STOPPING = 4;
  RUN_STATE_ERROR = 5;
}

message ShowSnapshot {
  uint64 sequence = 1;
  uint64 captured_at_unix_ms = 2;
  RunState run_state = 3;
  string status_message = 4;
  bool blackout = 5;
  AudioAnalysis audio = 6;
  AudioRuntimeStatus audio_runtime = 7;
  DmxRuntimeStatus dmx_runtime = 8;
  RecordingStatus recording = 9;
  BeatNetStatus beatnet = 10;
  MediaInfo media = 11;
  repeated FixtureState fixture_states = 12;
  bytes dmx_universe = 13;
  float effects_fps = 14;
  RuntimeTimingStatus timing = 15;
  uint64 config_generation = 16;
  EffectRuntimeStatus effect_runtime = 17;
}

message LiveFrame {
  uint64 sequence = 1;
  uint64 captured_at_unix_ms = 2;
  LiveAudioFrame audio = 3;
  repeated FixtureState fixture_states = 4;
  EffectRuntimeStatus effect_runtime = 5;
}

message LiveAudioFrame {
  float energy = 1;
  float rms = 2;
  float bass = 3;
  float mid = 4;
  float high = 5;
  float tempo = 6;
  bool beat_detected = 7;
  bool downbeat_detected = 8;
  float beat_confidence = 9;
  float beat_position = 10;
  float bar_position = 11;
  uint64 estimated_beat = 12;
  uint64 estimated_bar = 13;
  repeated float waveform = 14;
  repeated float spectrum = 15;
  uint32 meter = 16;
  uint32 beat_index = 17;
  float beat_activation = 18;
  float downbeat_activation = 19;
  float tracking_confidence = 20;
  float rms_dbfs = 21;
  float peak_dbfs = 22;
  bool clipping = 23;
  float spectrum_min_hz = 24;
  float spectrum_max_hz = 25;
  repeated float spectrogram_bins = 26;
  repeated float chroma = 27;
  uint32 key_pitch_class = 28;
  Tonality tonality = 29;
  float harmonic_confidence = 30;
  MusicSection section = 31;
  float section_confidence = 32;
}

message RuntimeTimingStatus {
  uint64 effects_deadlines_skipped = 1;
  uint64 audio_deadlines_skipped = 2;
  uint64 dmx_deadlines_skipped = 3;
  uint64 command_queue_rejections = 4;
  uint64 recoverable_audio_events = 5;
  float last_effect_tick_ms = 6;
  float max_effect_tick_ms = 7;
}

message AudioAnalysis {
  reserved 14, 15, 18, 19, 30;
  reserved "danceability", "history", "onset_history", "spectrogram", "valence";

  float energy = 1;
  float rms = 2;
  float bass = 3;
  float mid = 4;
  float high = 5;
  float tempo = 6;
  bool beat_detected = 7;
  bool downbeat_detected = 8;
  float beat_confidence = 9;
  float beat_position = 10;
  float bar_position = 11;
  uint64 estimated_beat = 12;
  uint64 estimated_bar = 13;
  repeated float waveform = 16;
  repeated float spectrum = 17;
  uint32 meter = 20;
  uint32 beat_index = 21;
  float beat_activation = 22;
  float downbeat_activation = 23;
  float tracking_confidence = 24;
  float rms_dbfs = 25;
  float peak_dbfs = 26;
  bool clipping = 27;
  float spectrum_min_hz = 28;
  float spectrum_max_hz = 29;
  repeated float chroma = 31;
  uint32 key_pitch_class = 32;
  Tonality tonality = 33;
  float harmonic_confidence = 34;
  MusicSection section = 35;
  float section_confidence = 36;
  repeated SectionMarker section_history = 37;
  repeated float spectrogram_bins = 38;
}

enum Tonality {
  TONALITY_UNSPECIFIED = 0;
  TONALITY_MAJOR = 1;
  TONALITY_MINOR = 2;
}

enum MusicSection {
  MUSIC_SECTION_UNSPECIFIED = 0;
  MUSIC_SECTION_INTRO = 1;
  MUSIC_SECTION_BUILD = 2;
  MUSIC_SECTION_BREAKDOWN = 3;
  MUSIC_SECTION_DROP = 4;
  MUSIC_SECTION_MAIN = 5;
  MUSIC_SECTION_OUTRO = 6;
}

message SectionMarker {
  MusicSection section = 1;
  uint64 estimated_bar = 2;
  float confidence = 3;
  uint64 sequence = 4;
}

message RgbColor {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

message MediaInfo {
  string track_name = 1;
  string artist_name = 2;
  bool is_playing = 3;
  repeated RgbColor album_colors = 4;
  string artwork_url = 5;
}

message BeatNetStatus {
  reserved 7;

  bool available = 1;
  bool processing = 2;
  string model_name = 3;
  string model_path = 4;
  string status = 5;
  string last_error = 6;
}

message RecordingStatus {
  bool recording = 1;
  bool has_recording = 2;
  float duration_seconds = 3;
  float max_duration_seconds = 4;
  uint32 sample_rate = 5;
  uint32 channels = 6;
  float peak = 7;
  float rms = 8;
  uint64 clipped_samples = 9;
  string source = 10;
  string error = 11;
  bool limit_reached = 12;
}

message Recording {
  RecordingStatus status = 1;
  bytes wav = 2;
}

message AudioRuntimeStatus {
  reserved 1, 10;
  reserved "configured_device_name", "missing_device_name";

  AudioInputMode configured_mode = 2;
  AudioInputMode actual_mode = 3;
  string device_name = 4;
  string device_type = 5;
  string host_api = 6;
  uint32 channels = 7;
  uint32 sample_rate = 8;
  string selection_reason = 9;
  bool running = 11;
  string last_error = 12;
  bool simulated = 13;
  string configured_device_id = 14;
  string device_id = 15;
  string missing_device_id = 16;
  uint64 dropped_sample_blocks = 17;
}

message DmxRuntimeStatus {
  string configured_port = 1;
  string port = 2;
  string device_info = 3;
  string interface_type = 4;
  string break_method = 5;
  bool running = 6;
  bool is_open = 7;
  uint64 send_count = 8;
  uint64 error_count = 9;
  uint64 consecutive_errors = 10;
  string last_error = 11;
  bool simulated = 12;
}

message AudioDevice {
  reserved 3;
  reserved "source_name";

  string id = 1;
  string name = 2;
  string device_type = 4;
  uint32 channels = 5;
  uint32 output_channels = 6;
  uint32 sample_rate = 7;
  string host_api = 8;
  bool is_default = 9;
  bool is_default_loopback = 10;
}

message BluetoothReceiverStatus {
  bool supported = 1;
  bool receiver_ready = 2;
  string platform = 3;
  string adapter_name = 4;
  bool powered = 5;
  bool discoverable = 6;
  bool pairable = 7;
  string status_message = 8;
  string last_error = 9;
  string setup_hint = 10;
  repeated BluetoothReceiverDevice devices = 11;
}

message BluetoothReceiverDevice {
  string id = 1;
  string name = 2;
  bool paired = 3;
  bool trusted = 4;
  bool connected = 5;
  bool audio_capable = 6;
}

enum AudioInputMode {
  AUDIO_INPUT_MODE_UNSPECIFIED = 0;
  AUDIO_INPUT_MODE_AUTO = 1;
  AUDIO_INPUT_MODE_SYSTEM_AUDIO = 2;
  AUDIO_INPUT_MODE_MANUAL_DEVICE = 3;
  AUDIO_INPUT_MODE_PIPEWIRE_SINK = 4;
  AUDIO_INPUT_MODE_MICROPHONE = 5;
  AUDIO_INPUT_MODE_BLUETOOTH_RECEIVER = 6;
}

message ShowConfig {
  string name = 1;
  DmxConfig dmx = 2;
  AudioConfig audio = 3;
  EffectsConfig effects = 4;
  repeated GrandMa2FixtureFile imported_fixture_files = 5;
  repeated FixtureConfig fixtures = 6;
  bool allow_dmx_overlaps = 7;
}

message DmxConfig {
  string port = 1;
  uint32 universe_size = 2;
  uint32 fps = 3;
  bool simulate = 4;
}

message AudioConfig {
  reserved 2, 3;
  reserved "device_name", "pipewire_source_name";

  AudioInputMode mode = 1;
  bool simulate = 4;
  float gain = 5;
  string beatnet_model_path = 6;
  string device_id = 7;
}

message EffectsConfig {
  VisualizationMode mode = 1;
  float intensity = 2;
  bool force_max_brightness = 3;
  float color_speed = 4;
  float beat_sensitivity = 5;
  float smooth_factor = 6;
  bool strobe_on_drop = 7;
  bool movement_enabled = 8;
  float movement_speed = 9;
  MovementMode movement_mode = 10;
  EffectFixtureMode effect_fixture_mode = 11;
  RotationMode rotation_mode = 12;
  bool strobe_effect_enabled = 13;
  StrobeEffectMode strobe_effect_mode = 14;
  float strobe_effect_speed = 15;
  bool harmony_palette_enabled = 16;
}

message EffectRuntimeStatus {
  VisualizationMode visualization_mode = 1;
  MovementMode movement_mode = 2;
  RotationMode rotation_mode = 3;
  StrobeEffectMode strobe_effect_mode = 4;
  uint32 palette_index = 5;
  RgbColor rendered_color = 6;
  bool drop_active = 7;
  bool strobe_active = 8;
  bool beat_accent_active = 9;
  float beat_response = 10;
  EnergyTier energy_tier = 11;
  repeated EffectDriver active_drivers = 12;
  uint32 effect_cycle_position = 13;
  bool harmony_palette_active = 14;
}

enum EnergyTier {
  ENERGY_TIER_UNSPECIFIED = 0;
  ENERGY_TIER_LOW = 1;
  ENERGY_TIER_MEDIUM = 2;
  ENERGY_TIER_HIGH = 3;
}

enum EffectDriver {
  EFFECT_DRIVER_UNSPECIFIED = 0;
  EFFECT_DRIVER_ENERGY = 1;
  EFFECT_DRIVER_BASS = 2;
  EFFECT_DRIVER_MID = 3;
  EFFECT_DRIVER_HIGH = 4;
  EFFECT_DRIVER_BEAT = 5;
  EFFECT_DRIVER_DOWNBEAT = 6;
  EFFECT_DRIVER_PALETTE = 7;
  EFFECT_DRIVER_STRUCTURE = 8;
  EFFECT_DRIVER_HARMONY = 9;
  EFFECT_DRIVER_TIME = 10;
}

enum VisualizationMode {
  VISUALIZATION_MODE_UNSPECIFIED = 0;
  VISUALIZATION_MODE_ENERGY = 1;
  VISUALIZATION_MODE_FREQUENCY_SPLIT = 2;
  VISUALIZATION_MODE_BEAT_PULSE = 3;
  VISUALIZATION_MODE_COLOR_CYCLE = 4;
  VISUALIZATION_MODE_RAINBOW_WAVE = 5;
  VISUALIZATION_MODE_STROBE_BEAT = 6;
  VISUALIZATION_MODE_RANDOM_FLASH = 7;
}

enum MovementMode {
  MOVEMENT_MODE_UNSPECIFIED = 0;
  MOVEMENT_MODE_SUBTLE = 1;
  MOVEMENT_MODE_STANDARD = 2;
  MOVEMENT_MODE_DRAMATIC = 3;
  MOVEMENT_MODE_WALL_WASH = 4;
  MOVEMENT_MODE_SWEEP = 5;
  MOVEMENT_MODE_RANDOM = 6;
  MOVEMENT_MODE_CIRCLE = 7;
  MOVEMENT_MODE_FIGURE_8 = 8;
  MOVEMENT_MODE_BALLYHOO = 9;
  MOVEMENT_MODE_FAN = 10;
  MOVEMENT_MODE_CHASE = 11;
  MOVEMENT_MODE_STROBE_POSITION = 12;
  MOVEMENT_MODE_CRAZY = 13;
}

enum EffectFixtureMode {
  EFFECT_FIXTURE_MODE_UNSPECIFIED = 0;
  EFFECT_FIXTURE_MODE_BALANCED = 1;
  EFFECT_FIXTURE_MODE_STROBE_FOCUS = 2;
  EFFECT_FIXTURE_MODE_MOVEMENT_FOCUS = 3;
  EFFECT_FIXTURE_MODE_STROBE_ONLY = 4;
  EFFECT_FIXTURE_MODE_MOVEMENT_ONLY = 5;
}

enum RotationMode {
  ROTATION_MODE_UNSPECIFIED = 0;
  ROTATION_MODE_OFF = 1;
  ROTATION_MODE_MANUAL_SLOW = 2;
  ROTATION_MODE_MANUAL_BEAT = 3;
  ROTATION_MODE_AUTO_SLOW = 4;
  ROTATION_MODE_AUTO_MEDIUM = 5;
  ROTATION_MODE_AUTO_FAST = 6;
  ROTATION_MODE_AUTO_MUSIC = 7;
}

enum StrobeEffectMode {
  STROBE_EFFECT_MODE_UNSPECIFIED = 0;
  STROBE_EFFECT_MODE_OFF = 1;
  STROBE_EFFECT_MODE_AUTO = 2;
  STROBE_EFFECT_MODE_EFFECT_1 = 3;
  STROBE_EFFECT_MODE_EFFECT_2 = 4;
  STROBE_EFFECT_MODE_EFFECT_3 = 5;
  STROBE_EFFECT_MODE_EFFECT_4 = 6;
  STROBE_EFFECT_MODE_EFFECT_5 = 7;
  STROBE_EFFECT_MODE_EFFECT_6 = 8;
  STROBE_EFFECT_MODE_EFFECT_7 = 9;
  STROBE_EFFECT_MODE_EFFECT_8 = 10;
  STROBE_EFFECT_MODE_EFFECT_9 = 11;
  STROBE_EFFECT_MODE_EFFECT_10 = 12;
  STROBE_EFFECT_MODE_EFFECT_11 = 13;
  STROBE_EFFECT_MODE_EFFECT_12 = 14;
  STROBE_EFFECT_MODE_EFFECT_13 = 15;
  STROBE_EFFECT_MODE_EFFECT_14 = 16;
  STROBE_EFFECT_MODE_EFFECT_15 = 17;
  STROBE_EFFECT_MODE_EFFECT_16 = 18;
  STROBE_EFFECT_MODE_EFFECT_17 = 19;
  STROBE_EFFECT_MODE_EFFECT_18_STROBE = 20;
}

message GrandMa2FixtureFile {
  string id = 1;
  string filename = 2;
  string xml = 3;
}

message GrandMa2FixtureType {
  string id = 1;
  string file_id = 2;
  string name = 3;
  string manufacturer = 4;
  string mode = 5;
  uint32 channel_count = 6;
  bool built_in = 7;
  repeated string warnings = 8;
  repeated GrandMa2Channel channels = 9;
  FixtureVisual visual = 10;
  string revision = 11;
}

message GrandMa2Channel {
  uint32 coarse = 1;
  optional uint32 fine = 2;
  string name = 3;
  string attribute = 4;
  string feature = 5;
  uint32 default_value = 6;
  repeated GrandMa2ChannelFunction functions = 7;
}

message GrandMa2ChannelFunction {
  string name = 1;
  string attribute = 2;
  string feature = 3;
  string subattribute = 4;
  uint32 from_dmx = 5;
  uint32 to_dmx = 6;
  float physical_from = 7;
  float physical_to = 8;
  repeated GrandMa2ChannelSet channel_sets = 9;
}

message GrandMa2ChannelSet {
  string name = 1;
  uint32 from_dmx = 2;
  uint32 to_dmx = 3;
}

enum FixtureVisualKind {
  FIXTURE_VISUAL_KIND_UNSPECIFIED = 0;
  FIXTURE_VISUAL_KIND_MOVING_HEAD = 1;
  FIXTURE_VISUAL_KIND_PAR = 2;
  FIXTURE_VISUAL_KIND_EFFECT = 3;
  FIXTURE_VISUAL_KIND_OTHER = 4;
}

enum FixtureEmitterKind {
  FIXTURE_EMITTER_KIND_UNSPECIFIED = 0;
  FIXTURE_EMITTER_KIND_COLOR = 1;
  FIXTURE_EMITTER_KIND_WHITE = 2;
  FIXTURE_EMITTER_KIND_STROBE = 3;
}

enum FixtureModelKind {
  FIXTURE_MODEL_KIND_UNSPECIFIED = 0;
  FIXTURE_MODEL_KIND_HEAD_MOVER = 1;
  FIXTURE_MODEL_KIND_DERBY_EFFECT = 2;
  FIXTURE_MODEL_KIND_COMPACT_EFFECT = 3;
  FIXTURE_MODEL_KIND_GENERIC = 4;
}

enum FixtureModelNodeKind {
  FIXTURE_MODEL_NODE_KIND_UNSPECIFIED = 0;
  FIXTURE_MODEL_NODE_KIND_GROUP = 1;
  FIXTURE_MODEL_NODE_KIND_MESH = 2;
  FIXTURE_MODEL_NODE_KIND_PAN_AXIS = 3;
  FIXTURE_MODEL_NODE_KIND_TILT_AXIS = 4;
  FIXTURE_MODEL_NODE_KIND_BEAM = 5;
  FIXTURE_MODEL_NODE_KIND_BEAM_DIAMETER = 6;
  FIXTURE_MODEL_NODE_KIND_BEAM_CLIP = 7;
}

message FixtureVisual {
  FixtureVisualKind kind = 1;
  float width_m = 2;
  float height_m = 3;
  float depth_m = 4;
  float pan_min_degrees = 5;
  float pan_max_degrees = 6;
  float tilt_min_degrees = 7;
  float tilt_max_degrees = 8;
  repeated FixtureEmitter emitters = 9;
  repeated FixtureModelNode model_nodes = 10;
  FixtureModelKind model_kind = 11;
  float zoom_physical_from_degrees = 12;
  float zoom_physical_to_degrees = 13;
}

message FixtureEmitter {
  string id = 1;
  string name = 2;
  FixtureEmitterKind kind = 3;
  float beam_angle_degrees = 4;
  float beam_intensity = 5;
  float x_m = 6;
  float y_m = 7;
  float z_m = 8;
  uint32 color_rgb = 9;
  float direction_x = 10;
  float direction_y = 11;
  float direction_z = 12;
  bool casts_beam = 13;
  float aperture_m = 14;
  string model_node_id = 15;
}

message FixtureMesh {
  string id = 1;
  string name = 2;
  repeated float vertices = 3;
  repeated float normals = 4;
  repeated uint32 indices = 5;
  uint32 color_rgb = 6;
}

message FixtureModelTransform {
  float x_m = 1;
  float y_m = 2;
  float z_m = 3;
  float quaternion_x = 4;
  float quaternion_y = 5;
  float quaternion_z = 6;
  float quaternion_w = 7;
  float scale_x = 8;
  float scale_y = 9;
  float scale_z = 10;
}

message FixtureModelNode {
  string id = 1;
  string name = 2;
  FixtureModelNodeKind kind = 3;
  FixtureModelTransform transform = 4;
  FixtureMesh mesh = 5;
  repeated FixtureModelNode children = 6;
  string emitter_id = 7;
  float beam_diameter_m = 8;
  float beam_clipping_distance_m = 9;
}

message FixtureConfig {
  string id = 1;
  string name = 2;
  string fixture_type_id = 3;
  uint32 start_channel = 4;
  uint32 position = 5;
  float intensity_scale = 6;
  float movement_pan_min = 7;
  float movement_pan_max = 8;
  float movement_tilt_min = 9;
  float movement_tilt_max = 10;
  FixtureStagePlacement stage_placement = 11;
}

message FixtureStagePlacement {
  float x_m = 1;
  float y_m = 2;
  float z_m = 3;
  float rotation_x_degrees = 4;
  float rotation_y_degrees = 5;
  float rotation_z_degrees = 6;
  bool focus_target_enabled = 7;
  float focus_target_x_m = 8;
  float focus_target_y_m = 9;
  float focus_target_z_m = 10;
}

message FixtureState {
  string fixture_id = 1;
  string fixture_name = 2;
  uint32 red = 3;
  uint32 green = 4;
  uint32 blue = 5;
  uint32 white = 6;
  uint32 amber = 7;
  uint32 uv = 8;
  uint32 cyan = 9;
  uint32 magenta = 10;
  uint32 yellow = 11;
  uint32 dimmer = 12;
  uint32 strobe = 13;
  uint32 pan = 14;
  uint32 pan_fine = 15;
  uint32 tilt = 16;
  uint32 tilt_fine = 17;
  uint32 pan_tilt_speed = 18;
  uint32 color_macro = 19;
  uint32 effect = 20;
  uint32 effect_speed = 21;
  uint32 effect_pattern = 22;
  uint32 gobo = 23;
  uint32 prism = 24;
  uint32 zoom = 25;
  uint32 focus = 26;
  uint32 iris = 27;
  // Normalized physical rotation phase used by the live stage preview.
  float effect_rotation = 28;
}
