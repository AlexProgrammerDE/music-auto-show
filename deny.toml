[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # Candle 0.11 requires zip 8. These fixes start at zip 9.
    { id = "RUSTSEC-2026-0367", reason = "Candle reads checkpoint entries in memory and never extracts ZIP files." },
    { id = "RUSTSEC-2026-0368", reason = "Candle reads checkpoint entries in memory and never extracts ZIP files." },
    { id = "RUSTSEC-2026-0369", reason = "Candle reads checkpoint entries in memory and never extracts ZIP files." },
    { id = "RUSTSEC-2026-0429", reason = "Candle reads checkpoint entries in memory and never extracts ZIP files." },
    { id = "RUSTSEC-2026-0545", reason = "The checkpoint reader does not enable the zip aes-crypto feature or read encrypted entries." },
    { id = "RUSTSEC-2026-0546", reason = "Candle reads checkpoint entries in memory and never extracts ZIP files." },
    { id = "RUSTSEC-2026-0547", reason = "The checkpoint reader does not enable the zip legacy-zip feature." },
    { id = "RUSTSEC-2026-0548", reason = "Candle reads checkpoint entries through ZipArchive and does not use ZipStreamReader." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
