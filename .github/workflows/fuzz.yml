name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "fixtures/grandma2/**"
      - "fuzz/**"
      - "proto/**"
      - "src/beatnet.rs"
      - "src/checkpoint.rs"
      - "src/config.rs"
      - "src/config/**"
      - "src/dmx.rs"
      - "src/grandma2.rs"
      - "src/grandma2/**"
      - "src/lib.rs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "fixtures/grandma2/**"
      - "fuzz/**"
      - "proto/**"
      - "src/beatnet.rs"
      - "src/checkpoint.rs"
      - "src/config.rs"
      - "src/config/**"
      - "src/dmx.rs"
      - "src/grandma2.rs"
      - "src/grandma2/**"
      - "src/lib.rs"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # nightly-2026-11-01 fails to compile zbus (pulled in by nowhear) with an
  # E0391 "needs async drop" query cycle, so this repository pins an earlier
  # nightly for fuzzing.
  FUZZ_TOOLCHAIN: nightly-2026-07-09
  # The prebuilt cargo-fuzz binary defaults to musl, which ASan does not support.
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - grandma2_import
          - grandma2_reload
          - config_json
          - config_proto
          - beatnet_checkpoint
    env:
      TARGET: ${{ matrix.target }}
      # Pull requests and pushes run a short check. The weekly run fuzzes longer.
      SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev pkg-config

      - name: Install fuzzing toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2

      # build.rs embeds the frontend, so the fuzz build needs Bun and the
      # frontend dependencies.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build fuzz target
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build --target "$FUZZ_TRIPLE" "$TARGET"

      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +"$FUZZ_TOOLCHAIN" fuzz run --target "$FUZZ_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10

      - name: Save corpus
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
